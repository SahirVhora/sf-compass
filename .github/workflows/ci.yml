name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate site structure and assurance lifecycle
        run: python scripts/validate_site.py
      - name: Test engagement gate decisions and edge cases
        run: node --test engagement-pack.test.mjs scripts/build-engagement-pack.test.mjs
